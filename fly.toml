app = "delta-paper-trader"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  # Comma-separated list of allowed CORS origins (set via fly secrets or here).
  ALLOWED_ORIGINS = "https://delta-paper-trader.fly.dev"
  # Persist the SQLite DB on the mounted volume so baskets/positions survive deploys.
  DB_PATH = "/data/paper_trade.db"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep the single instance alive for a 24/7 feed (one broker session only).
  auto_stop_machines = false
  auto_start_machines = true

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Single broker session => exactly one instance; never scale out.
# Mount a volume so the database persists across deploys.
[[mounts]]
  source = "delta_data"
  destination = "/data"
